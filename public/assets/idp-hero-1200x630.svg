<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo base -->
  <rect width="1200" height="630" fill="#F8FDFB"/>

  <!-- Formas geométricas de fondo — textura sutil -->
  <circle cx="980" cy="80" r="220" fill="#E6F5EE"/>
  <circle cx="1100" cy="580" r="160" fill="#E6F5EE" opacity="0.6"/>
  <circle cx="60" cy="520" r="120" fill="#E6F5EE" opacity="0.5"/>

  <!-- Grid de puntos — textura territorial -->
  <g opacity="0.15">
    <circle cx="80" cy="80" r="2" fill="#0A7D55"/>
    <circle cx="140" cy="80" r="2" fill="#0A7D55"/>
    <circle cx="200" cy="80" r="2" fill="#0A7D55"/>
    <circle cx="80" cy="140" r="2" fill="#0A7D55"/>
    <circle cx="140" cy="140" r="2" fill="#0A7D55"/>
    <circle cx="200" cy="140" r="2" fill="#0A7D55"/>
    <circle cx="80" cy="200" r="2" fill="#0A7D55"/>
    <circle cx="140" cy="200" r="2" fill="#0A7D55"/>
    <circle cx="200" cy="200" r="2" fill="#0A7D55"/>
    <circle cx="80" cy="260" r="2" fill="#0A7D55"/>
    <circle cx="140" cy="260" r="2" fill="#0A7D55"/>
    <circle cx="200" cy="260" r="2" fill="#0A7D55"/>
  </g>

  <!-- Mapa abstracto — rutas entre puntos de venta -->
  <!-- Ruta principal verde -->
  <path d="M200 420 Q320 280 460 340 Q560 380 660 260 Q740 160 880 220" stroke="#0A7D55" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.3"/>
  <!-- Ruta secundaria -->
  <path d="M200 420 Q300 480 420 460 Q520 440 600 500 Q700 540 820 480" stroke="#4DB888" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.25" stroke-dasharray="8 6"/>

  <!-- Puntos de venta — nodos en el mapa -->
  <circle cx="200" cy="420" r="10" fill="#0A7D55" opacity="0.3"/>
  <circle cx="460" cy="340" r="8" fill="#0A7D55" opacity="0.4"/>
  <circle cx="660" cy="260" r="8" fill="#0A7D55" opacity="0.4"/>
  <circle cx="880" cy="220" r="10" fill="#0A7D55" opacity="0.3"/>
  <circle cx="420" cy="460" r="7" fill="#4DB888" opacity="0.35"/>
  <circle cx="600" cy="500" r="7" fill="#4DB888" opacity="0.35"/>
  <circle cx="820" cy="480" r="7" fill="#4DB888" opacity="0.35"/>

  <!-- Acento naranja — punto de urgencia -->
  <circle cx="660" cy="260" r="5" fill="#E8540A" opacity="0.7"/>
  <circle cx="420" cy="460" r="4" fill="#E8540A" opacity="0.5"/>

  <!-- Panel de UI — card principal -->
  <rect x="680" y="100" width="440" height="430" rx="20" fill="white" opacity="0.95"/>
  <rect x="680" y="100" width="440" height="430" rx="20" stroke="#D4EDE3" stroke-width="1"/>

  <!-- Header del card -->
  <rect x="680" y="100" width="440" height="72" rx="20" fill="#0A7D55"/>
  <rect x="680" y="152" width="440" height="20" fill="#0A7D55"/>
  <text x="704" y="130" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" letter-spacing="1.5" fill="white" opacity="0.6">LUNES 22 JUN</text>
  <text x="704" y="158" font-family="'DM Sans', system-ui, sans-serif" font-size="18" font-weight="500" fill="white">Tu ruta de hoy</text>

  <!-- Store cards dentro del panel -->
  <!-- Card 1 — urgente -->
  <rect x="704" y="192" width="392" height="68" rx="10" fill="#FDF0E8"/>
  <rect x="704" y="192" width="392" height="68" rx="10" stroke="#F5C4A0" stroke-width="0.5"/>
  <rect x="1044" y="204" width="52" height="20" rx="10" fill="#F5A878"/>
  <text x="1050" y="218" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#7A3010">Urgente</text>
  <text x="724" y="218" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#111C17">Abarrotes Morales</text>
  <text x="724" y="238" font-family="'DM Sans', system-ui, sans-serif" font-size="11" fill="#C44A08">2.1 km · Inventario bajo</text>
  <circle cx="714" cy="226" r="4" fill="#E8540A" opacity="0.8"/>

  <!-- Card 2 — al día -->
  <rect x="704" y="272" width="392" height="68" rx="10" fill="white"/>
  <rect x="704" y="272" width="392" height="68" rx="10" stroke="#D4EDE3" stroke-width="0.5"/>
  <rect x="1044" y="284" width="44" height="20" rx="10" fill="#E6F5EE"/>
  <text x="1050" y="298" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#0A7D55">Al día</text>
  <text x="724" y="298" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#111C17">Mini Super El Pino</text>
  <text x="724" y="318" font-family="'DM Sans', system-ui, sans-serif" font-size="11" fill="#6B9E87">3.8 km · Visitada hace 3 días</text>
  <circle cx="714" cy="306" r="4" fill="#0A7D55" opacity="0.6"/>

  <!-- Card 3 — pendiente -->
  <rect x="704" y="352" width="392" height="68" rx="10" fill="white"/>
  <rect x="704" y="352" width="392" height="68" rx="10" stroke="#D4EDE3" stroke-width="0.5"/>
  <rect x="1028" y="364" width="68" height="20" rx="10" fill="#F1F5F2"/>
  <text x="1034" y="378" font-family="'DM Sans', system-ui, sans-serif" font-size="10" fill="#6B9E87">Pendiente</text>
  <text x="724" y="378" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#111C17">Tienda La Esquina</text>
  <text x="724" y="398" font-family="'DM Sans', system-ui, sans-serif" font-size="11" fill="#6B9E87">5.2 km · 7 días sin visita</text>
  <circle cx="714" cy="386" r="4" fill="#B3DFC9"/>

  <!-- Botón CTA en card -->
  <rect x="704" y="440" width="392" height="44" rx="8" fill="#0A7D55"/>
  <text x="900" y="467" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="white" text-anchor="middle">Comenzar recorrido</text>

  <!-- Texto hero izquierdo -->
  <text x="80" y="130" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="400" letter-spacing="2" fill="#6B9E87">INVENTORY DISTRIBUTION PLATFORM</text>

  <text x="80" y="198" font-family="'DM Sans', system-ui, sans-serif" font-size="52" font-weight="500" letter-spacing="-2" fill="#111C17">Distribuye</text>
  <text x="80" y="258" font-family="'DM Sans', system-ui, sans-serif" font-size="52" font-weight="500" letter-spacing="-2" fill="#0A7D55">más rápido,</text>
  <text x="80" y="318" font-family="'DM Sans', system-ui, sans-serif" font-size="52" font-weight="500" letter-spacing="-2" fill="#111C17">vende más.</text>

  <text x="80" y="370" font-family="'DM Sans', system-ui, sans-serif" font-size="16" fill="#6B9E87">Rutas optimizadas, inventario en tiempo real</text>
  <text x="80" y="392" font-family="'DM Sans', system-ui, sans-serif" font-size="16" fill="#6B9E87">y control total desde tu celular.</text>

  <!-- CTA buttons -->
  <rect x="80" y="422" width="160" height="44" rx="8" fill="#0A7D55"/>
  <text x="160" y="449" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="white" text-anchor="middle">Empezar gratis</text>
  <rect x="252" y="422" width="140" height="44" rx="8" fill="transparent" stroke="#0A7D55" stroke-width="1.5"/>
  <text x="322" y="449" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#0A7D55" text-anchor="middle">Ver demo</text>

  <!-- Accent dot naranja decorativo -->
  <circle cx="80" cy="560" r="6" fill="#E8540A" opacity="0.6"/>
  <circle cx="100" cy="568" r="4" fill="#E8540A" opacity="0.35"/>
  <circle cx="116" cy="560" r="3" fill="#E8540A" opacity="0.2"/>

  <!-- Logomark pequeño bottom left -->
  <rect x="80" y="580" width="22" height="22" rx="5" fill="#0A7D55"/>
  <circle cx="86" cy="596" r="2" fill="white" opacity="0.5"/>
  <circle cx="96" cy="586" r="2.5" fill="white"/>
  <path d="M86 596 Q91 582 96 586" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <text x="108" y="596" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="500" letter-spacing="-0.5" fill="#111C17">IDP</text>
</svg>
