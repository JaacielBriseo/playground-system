real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# Rate limit zones (keyed by real client IP after CloudFront unwrap)
limit_req_zone  $binary_remote_addr  zone=login:10m   rate=10r/m;
limit_req_zone  $binary_remote_addr  zone=api:10m     rate=120r/m;
limit_req_zone  $binary_remote_addr  zone=global:10m  rate=300r/m;
limit_conn_zone $binary_remote_addr  zone=conn:10m;

# Flag rate-limited requests for the scanner log.
# 429 = limit_req_status / limit_conn_status (set below).
# Dotfile and sensitive-path probes are logged per-location (see those blocks).
# 503 is intentionally excluded: it signals PHP-FPM unavailability, not scanner
# activity, and would flood scanner.log during normal deploys.
map $status $is_suspicious {
    default 0;
    429     1;
}

log_format scanner_fmt '$time_iso8601 | $remote_addr | $request | $status | "$http_user_agent" | "$http_referer"';

# Scheme Laravel should believe it is serving, which decides whether generated
# URLs and redirects come out http:// or https://.
#
# Behind a TLS terminator (CloudFront, ALB, Cloudflare) that header is set and we
# honour it. Connecting straight to nginx — which is what the dev compose does —
# it is absent, so fall back to nginx's own scheme. Hardcoding "https" here
# breaks local development: every redirect lands on a URL nothing is serving.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    ~.      $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    root  /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Slowloris mitigation
    keepalive_timeout     30;
    client_body_timeout   10;
    client_header_timeout 10;
    send_timeout          10;

    # Gzip
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    application/x-javascript text/xml application/xml text/javascript;

    # Security headers (CloudFront forwards these to the browser)
    add_header X-Frame-Options           "SAMEORIGIN"                               always;
    add_header X-Content-Type-Options    "nosniff"                                  always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"          always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"      always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; font-src 'self' data: https://fonts.bunny.net; img-src 'self' data: blob: https://*.amazonaws.com; connect-src 'self' https://api.stripe.com; frame-src 'self' https://js.stripe.com https://checkout.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com;" always;

    # Primary access log → stdout so docker logs / CloudWatch picks it up.
    access_log /dev/stdout combined;
    # Secondary log — only rate-limited (429) responses and sensitive-path probes.
    # Mounted at scanner/ subdir so the named volume does not shadow nginx's
    # /dev/stdout and /dev/stderr symlinks.
    access_log /var/log/nginx/scanner/suspicious.log scanner_fmt if=$is_suspicious;

    # Max concurrent connections per IP
    limit_conn conn 50;
    # Return 429 (not 444) for rate/conn-limited requests. CloudFront treats a bare
    # TCP close as an origin failure and retries up to 3 times; 429 is forwarded once.
    limit_req_status  429;
    limit_conn_status 429;
    # IP blocklist — outside conf.d/ so the nginx.conf glob does not double-include it
    include /etc/nginx/blocklist.conf;

    # Certbot ACME challenge (kept for potential direct-cert fallback)
    location /.well-known/acme-challenge/ {
        limit_req zone=global burst=5 nodelay;
        root /var/www/certbot;
    }

    # Vite-built assets — fingerprinted filenames, cache forever.
    # Security headers must be restated: nginx's add_header inheritance rule drops ALL
    # parent add_header directives from any location that defines its own add_header.
    location /build/ {
        limit_req zone=global burst=20 nodelay;
        expires max;
        add_header Cache-Control             "public, immutable"                        always;
        add_header X-Content-Type-Options    "nosniff"                                  always;
        add_header X-Frame-Options           "SAMEORIGIN"                               always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"          always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"      always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; font-src 'self' data: https://fonts.bunny.net; img-src 'self' data: blob: https://*.amazonaws.com; connect-src 'self' https://api.stripe.com; frame-src 'self' https://js.stripe.com https://checkout.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com;" always;
        try_files $uri =404;
    }

    # Public assets (logos, favicons) — not fingerprinted, so no long-lived cache.
    # burst=20 prevents false-positive 429s when a browser fires 4+ parallel asset
    # requests on page load (burst=5 in location / is too tight for static files).
    location /assets/ {
        limit_req zone=global burst=20 nodelay;
        add_header Cache-Control             "public, max-age=3600"                     always;
        add_header X-Content-Type-Options    "nosniff"                                  always;
        add_header X-Frame-Options           "SAMEORIGIN"                               always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"          always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"      always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; font-src 'self' data: https://fonts.bunny.net; img-src 'self' data: blob: https://*.amazonaws.com; connect-src 'self' https://api.stripe.com; frame-src 'self' https://js.stripe.com https://checkout.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com;" always;
        try_files $uri =404;
    }

    # Auth endpoints — strict rate limit against brute force
    location ~ ^/(login|register|password|forgot-password|reset-password) {
        limit_req zone=login burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # API routes — moderate rate limit
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Inertia SPA — all routes fall back to index.php.
    # Global rate limit lives here rather than at server level so that /api/ and
    # auth locations can use their own burst values without the global burst=5
    # silently capping them via nginx's cumulative limit_req inheritance.
    location / {
        limit_req zone=global burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Reject requests for PHP files that don't exist on disk.
        # Prevents PHP-FPM from leaking "File not found." for scanner probes.
        try_files $uri =404;
        fastcgi_pass   app:9000;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
        # Pass the nginx-resolved real client IP to PHP as X-Forwarded-For.
        # $remote_addr here is already the unwrapped client IP (after real_ip processing above),
        # NOT the raw XFF chain — so Laravel's throttle and $request->ip() get the correct value.
        fastcgi_param  HTTP_X_FORWARDED_FOR   $remote_addr;
        # Laravel's TrustProxies reads this to decide the scheme of generated and
        # signed URLs (email verification links, password resets). See the
        # $forwarded_proto map above for how it is resolved.
        #
        # In production, terminate TLS in front of nginx and make sure that proxy
        # sets X-Forwarded-Proto — otherwise signed URLs will be built as http://
        # and fail verification against an https:// site.
        fastcgi_param  HTTP_X_FORWARDED_PROTO $forwarded_proto;
    }

    # Block source maps — never serve .map files in production.
    location ~* \.map$ {
        limit_req zone=global burst=5 nodelay;
        return 404;
    }

    # Sensitive non-dotfile infra files. Return 404 (not 444): CloudFront sits in
    # front and treats a bare TCP close as an origin failure, retrying the request
    # up to 3 times and amplifying scanner traffic. A 404 is forwarded once, cleanly.
    # Log every probe to scanner/suspicious.log regardless of rate-limit status.
    location ~* \.(sql|bak|swp|save|orig)$ {
        limit_req zone=global burst=5 nodelay;
        access_log /var/log/nginx/scanner/suspicious.log scanner_fmt;
        return 404;
    }
    location ~* ^/(Dockerfile[^/]*|docker-compose[^/]*|Makefile|composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|serverless\.(yml|yaml|json)|terraform\.(tfvars|tfstate))$ {
        limit_req zone=global burst=5 nodelay;
        access_log /var/log/nginx/scanner/suspicious.log scanner_fmt;
        return 404;
    }

    # Block dot-files (except ACME challenge). Same rationale: 404 over 444 for CF.
    # Per-location log captures every probe; the path pattern is the suspicious signal,
    # not the status code.
    location ~* /\.(?!well-known).* {
        limit_req zone=global burst=5 nodelay;
        access_log /var/log/nginx/scanner/suspicious.log scanner_fmt;
        return 404;
    }
}

