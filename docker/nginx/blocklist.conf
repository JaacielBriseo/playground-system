# IP blocklist — included at server {} context from /etc/nginx/blocklist.conf.
# Placed outside conf.d/ so nginx.conf's http-level glob does not double-include it.
# Valid directives here: deny, allow. NOT valid: limit_req_zone, map, log_format (http-only).
#
# Format: deny <IP>;         # [YYYY-MM-DD] scanner type / reason
# CIDR:   deny 203.0.113.0/24;
#
# This file is baked into the nginx image. Changes require a rebuild and redeploy,
# which keeps every block in version control and auditable.
#
# Candidates come from the scanner log that default.conf writes:
#   docker compose -f docker-compose.dev.yml exec nginx \
#     sh -c 'cut -d"|" -f2 /var/log/nginx/scanner/suspicious.log | sort | uniq -c | sort -rn | head'
#
# For emergency hot-blocking without a redeploy (lost on the next restart):
#   docker compose -f docker-compose.prod.yml exec nginx \
#     sh -c 'echo "deny 203.0.113.4;" >> /etc/nginx/blocklist.conf && nginx -s reload'
#
# Add blocks below.
