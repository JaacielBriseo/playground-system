services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile.dev
    container_name: app-app
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: app
    env_file: .env
    volumes:
      - .:/var/www/html:cached
      # Anonymous volumes prevent the host bind-mount from overwriting
      # packages installed inside the image at build time.
      - /var/www/html/vendor
      - /var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sail

  nginx:
    image: nginx:1.27-alpine
    container_name: app-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/blocklist.conf:/etc/nginx/blocklist.conf:ro
      # default.conf writes suspicious requests here. Without this mount the
      # directory does not exist and nginx aborts on startup.
      - nginx_logs:/var/log/nginx/scanner
    depends_on:
      - app
    networks:
      - sail

  db:
    image: mysql:8.4
    container_name: app-db
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sail

  queue:
    build:
      context: .
      dockerfile: docker/app/Dockerfile.dev
    container_name: app-queue
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: queue
    env_file: .env
    volumes:
      - .:/var/www/html:cached
      - /var/www/html/vendor
    depends_on:
      - app
    networks:
      - sail

  mailpit:
    image: axllent/mailpit:latest
    container_name: app-mailpit
    ports:
      - "${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
    networks:
      - sail

volumes:
  db_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  sail:
    driver: bridge

